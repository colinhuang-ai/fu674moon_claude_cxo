<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: thanh lọc cố định trên cùng, tab theo dự án, mỗi tab đi từ tóm tắt (ô KPI) xuống chi tiết (xu hướng, giờ, kết quả, agent).
   Màu theo thực thể: TS-BH = xanh dương (slot 1), CS-VT = cam (slot 2). Trạng thái dùng bảng màu riêng + biểu tượng + chữ. */
:root{
  color-scheme:light;
  --bg:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --ink3:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --line:rgba(11,11,11,.10); --wash:rgba(11,11,11,.045);
  --s1:#2a78d6; --s2:#eb6834; --dim:#c3c2b7;
  --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --crit:#d03b3b; --na:#898781;
  --ord1:#86b6ef; --ord2:#3987e5; --ord3:#1c5cab; --ord4:#0d366b; --ordt1:#0b0b0b; --ordt2:#ffffff; --ordt3:#ffffff; --ordt4:#ffffff;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --ink3:#898781;
    --grid:#2c2c2a; --axis:#383835; --line:rgba(255,255,255,.10); --wash:rgba(255,255,255,.06);
    --s1:#3987e5; --s2:#d95926; --dim:#4b4a45; --good-ink:#0ca30c;
    --ord1:#184f95; --ord2:#256abf; --ord3:#5598e7; --ord4:#9ec5f4; --ordt1:#ffffff; --ordt2:#ffffff; --ordt3:#0b0b0b; --ordt4:#0b0b0b;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --ink3:#898781;
  --grid:#2c2c2a; --axis:#383835; --line:rgba(255,255,255,.10); --wash:rgba(255,255,255,.06);
  --s1:#3987e5; --s2:#d95926; --dim:#4b4a45; --good-ink:#0ca30c;
  --ord1:#184f95; --ord2:#256abf; --ord3:#5598e7; --ord4:#9ec5f4; --ordt1:#ffffff; --ordt2:#ffffff; --ordt3:#0b0b0b; --ordt4:#0b0b0b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:1360px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:22px 64px}
.hd{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;padding-bottom:16px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:600}
h1{font-size:clamp(22px,3.2vw,30px);line-height:1.15;font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin-top:4px}
.meta{font-size:12.5px;color:var(--ink2);max-width:60ch}

/* thanh lọc + tab */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 0;border-bottom:1px solid var(--line);margin-inline:calc(-1 * clamp(16px,3vw,32px));padding-inline:clamp(16px,3vw,32px)}
@media (max-width:899px){.bar{position:static}}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.fg{display:flex;align-items:center;gap:8px}
.fg>span{font-size:12px;color:var(--ink2);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--ink2);font-weight:500;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--wash)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 26px 6px 10px;font-size:13px;cursor:pointer;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
  background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.sum{margin-left:auto;font-size:12.5px;color:var(--ink2)}
.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;cursor:pointer;padding:10px 14px;font-size:14px;font-weight:500;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px;border-radius:4px}

/* khối nội dung */
#view{display:flex;flex-direction:column;gap:22px;padding-top:20px}
.sec>.sh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:10px}
.sec h2{font-size:15px;font-weight:600;letter-spacing:-.005em}
.sec .sn{font-size:12.5px;color:var(--ink2)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(205px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card>.ch{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px 12px;margin-bottom:10px}
.card h3{font-size:13.5px;font-weight:600;line-height:1.3}
.card .cs{font-size:12px;color:var(--ink2);margin-top:2px}
.tg{border:1px solid var(--line);background:transparent;border-radius:6px;padding:3px 9px;font-size:12px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tg:hover{background:var(--wash)}
.tg[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin-bottom:8px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend i.ln{height:3px;border-radius:2px;width:14px;vertical-align:3px}
.chart{position:relative;width:100%}
.chart svg{display:block;max-width:100%}
.chart text{font-family:var(--font)}
.empty{display:grid;place-items:center;height:100%;min-height:90px;color:var(--ink3);font-size:13px;text-align:center}
.note{font-size:12px;color:var(--ink2);margin-top:8px}

/* ô KPI */
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 10px;display:flex;flex-direction:column;gap:5px;min-width:0}
.t-label{font-size:12.5px;color:var(--ink2);font-weight:500}
.t-val{font-size:28px;line-height:1.1;font-weight:600;letter-spacing:-.015em}
.t-unit{font-size:15px;font-weight:500;color:var(--ink2);margin-left:3px;letter-spacing:0}
.t-sub{font-size:12px;color:var(--ink2)}
.t-delta{font-size:12px;color:var(--ink2);display:flex;gap:4px;align-items:center}
.t-delta.good{color:var(--good-ink)} .t-delta.crit{color:var(--crit)}
.spark{display:block;margin-top:2px;max-width:100%}
.pill{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;border-radius:999px;padding:2px 9px 2px 6px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--st) 16%,var(--surface));color:var(--ink)}
.pill svg{width:13px;height:13px;flex:none}
.pill.good{--st:var(--good)} .pill.warn{--st:var(--warn)} .pill.crit{--st:var(--crit)} .pill.na{--st:var(--na)}

/* hero + bảng điểm */
.hero{display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.hero .big{font-size:clamp(48px,7vw,64px);line-height:1;font-weight:600;letter-spacing:-.03em}
.split{display:flex;flex-direction:column;gap:6px;font-size:13px}
.split div{display:flex;align-items:center;gap:8px}
.split b{font-weight:600;margin-left:auto}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.tq{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:14px}
@media (max-width:980px){.tq{grid-template-columns:minmax(0,1fr)}}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11.5px;font-weight:600;color:var(--ink2);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--grid);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{white-space:nowrap}
.tbl.nw td,.tbl.nw th{white-space:nowrap}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl th.r{text-align:right}
.tbl .sortable{cursor:pointer;user-select:none}
.tbl .sortable:hover{color:var(--ink)}
.tbl th[aria-sort] {color:var(--ink)}
.tw{overflow-x:auto}
.dt{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.dt th,.dt td{padding:5px 10px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
.dt th:first-child,.dt td:first-child{text-align:left}
.dt th{color:var(--ink2);font-weight:600;position:sticky;top:0;background:var(--surface)}
.dtw{max-height:320px;overflow:auto}
.mut{color:var(--ink3)}
.kv{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--ink2);white-space:nowrap}

/* thanh ngang */
.hb{display:grid;grid-template-columns:minmax(110px,var(--lw,170px)) 1fr auto;align-items:center;gap:10px;padding:3px 0;font-size:13px}
.hb .lb{color:var(--ink);overflow-wrap:anywhere}
.hb .trk{height:16px;position:relative}
.hb .trk i{position:absolute;left:0;top:2px;height:12px;border-radius:0 4px 4px 0;min-width:2px;transition:filter .1s}
.hb:hover .trk i{filter:brightness(1.12)}
.hb .vl{font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.hb .vl small{color:var(--ink2);font-size:12px;margin-left:6px}
.hgrp{font-size:11.5px;font-weight:600;color:var(--ink2);margin:10px 0 2px;letter-spacing:.03em;text-transform:uppercase}
.hgrp:first-child{margin-top:0}
.fun{display:flex;flex-direction:column;gap:4px}
.fun .st{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:10px;align-items:center}
.fun .bar2{height:30px;border-radius:0 4px 4px 0;display:flex;align-items:center;padding-left:10px;color:#fff;font-weight:600;font-size:13px;min-width:56px;font-variant-numeric:tabular-nums}
.fun .arrow{margin-left:180px;font-size:12px;color:var(--ink2);padding:1px 0}

/* heatmap */
.hm{overflow-x:auto}
.hmg{display:grid;gap:2px;min-width:560px;align-items:center}
.hmg .c{height:22px;border-radius:3px;position:relative}
.hmg .c:hover{outline:2px solid var(--ink);outline-offset:-1px;z-index:1}
.hmg .rl,.hmg .cl{font-size:11px;color:var(--ink3);text-align:center}
.hmg .rl{text-align:left}
.hmg .c.no{background:repeating-linear-gradient(45deg,transparent 0 4px,var(--grid) 4px 5px)}
.scale{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink2);margin-top:8px}
.scale i{display:block;width:120px;height:8px;border-radius:4px}

/* call-out */
.co{display:flex;flex-direction:column;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.co .k{font-size:11.5px;font-weight:600;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase}
.co .v{font-size:14px;font-weight:500}
details.card summary{cursor:pointer;font-weight:600;font-size:13.5px}
details.card[open] summary{margin-bottom:10px}
a.lnk{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1px solid var(--axis);cursor:pointer}
a.lnk:hover{border-color:var(--ink)}
.recon{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.rc{flex:1 1 150px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);min-width:0}
.rc .k{font-size:12px;color:var(--ink2)}
.rc .v{font-size:22px;font-weight:600;letter-spacing:-.01em}
.rc.op{flex:0 0 auto;border:0;background:transparent;display:grid;place-items:center;padding:0 2px;font-size:20px;color:var(--ink3)}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 6px 24px rgba(0,0,0,.16);max-width:290px}
#tip .th{font-weight:600;margin-bottom:4px}
#tip .tr{display:flex;align-items:center;gap:8px;padding:1px 0}
#tip .tr i{width:12px;height:3px;border-radius:2px;flex:none}
#tip .tr b{margin-left:auto;padding-left:14px;font-variant-numeric:tabular-nums;font-weight:600}
#tip .tr span{color:var(--ink2)}
.fade{opacity:.55;transition:opacity .15s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    let lo=o.ymin!=null?o.ymin:Math.min(...ex),hi=o.ymax!=null?o.ymax:Math.max(...ex);
    if(o.ymin==null){const pad=(hi-lo)*.14||1;lo-=pad;hi+=pad;if(lo<0&&Math.min(...ex)>=0)lo=0}

    ov.addEventListener('pointerleave',off);ov.addEventListener('blur',off);
    let ki=0;ov.addEventListener('keydown',ev=>{if(ev.key==='ArrowLeft'||ev.key==='ArrowRight'){ki=Math.max(0,Math.min(n-1,ki+(ev.key==='ArrowRight'?1:-1)));const b=ov.getBoundingClientRect();show(ki,{clientX:b.left+band*(ki+.5),clientY:b.top+20});ev.preventDefault()}});

function delta(cur,prev,kind,upGood,label){
  if(cur==null||prev==null)return null;
  let diff,txt;
  if(kind==='pp'){diff=(cur-prev)*100;txt=nf1.format(Math.abs(diff))+' đ.%'}
  else if(kind==='s'){diff=cur-prev;txt=nf0.format(Math.abs(Math.round(diff)))+' s'}
  else{if(!prev)return null;diff=(cur/prev-1)*100;txt=nf1.format(Math.abs(diff))+'%'}
  const flat=Math.abs(diff)<(kind==='pp'?.05:kind==='s'?.5:.05);
  const dir=flat?'flat':diff>0?'up':'down';
  const tone=flat||upGood==null?'':((diff>0)===upGood?'good':'crit');
  return {dir,tone,txt:(flat?'≈ ':dir==='up'?'▲ +':'▼ −')+(flat?'':'')+txt+' '+label};
}

/* ===================== VIEW: AGENT ===================== */
function agentRows(p){
  const m=new Map();
  for(const r of A){
    if(r.d<st.from||r.d>st.to)continue;
    const am=M.agents[r.a];if(!am.ext||am.p!==p)continue;
    let o=m.get(r.a);if(!o){o={a:r.a,ext:am.ext,nv:am.nv,flag:am.flag,days:new Set(),calls:0,contacted:0,success:0,ans:0,esc:0,drop:0,resolved:0,tk:0,hd:0,ac:0,na:0};m.set(r.a,o)}
    o.days.add(r.d);o.tk+=r.tk;o.hd+=r.hd;o.ac+=r.ac;o.na+=r.na;
    if(r.g)continue;
    o.calls+=r.n;
    if(p===0){if(r.s===ST.CONNECTED){if(r.r===CAP2_CHU)o.success+=r.n;if(!r.q)o.contacted+=r.n}}
    else{if(r.s===ST.ANSWERED){o.ans+=r.n;const c=M.cap2[r.r];if(c==='Giải quyết xong')o.resolved+=r.n;else if(c==='Khiếu nại – chuyển cấp 2')o.esc+=r.n;else if(c==='Rớt cuộc gọi')o.drop+=r.n}}
  }
  return [...m.values()].map(o=>{
    o.shifts=o.days.size;Object.assign(o,ahtOf(o));
    o.conv=div(o.success,o.contacted);o.perShift=div(o.calls,o.shifts);
    o.resolvedR=div(o.resolved,o.ans);o.escR=div(o.esc,o.ans);o.dropR=div(o.drop,o.ans);
    const why=[];if(o.shifts<8)why.push('dưới 8 ca');
    if(o.flag.includes('NOI_DE_XUAT'))why.push('mã nối đề xuất, chờ HR');
    if(!o.nv)why.push('không có mã NV (thực tập sinh)');
    if(o.flag.includes('GAN_CO'))why.push('có cuộc trống mã agent');
    o.why=why;o.whyN=why.length;o.rank=why.length===0;
    return o;
  });
}

  function paint(){
    hr.replaceChildren();
    cols.forEach(c=>{const th=el('th',c.r?'r sortable':'sortable',c.l);if(sortK===c.k)th.setAttribute('aria-sort',dir<0?'descending':'ascending');
      th.tabIndex=0;th.addEventListener('click',()=>{if(sortK===c.k)dir=-dir;else{sortK=c.k;dir=(c.k==='ext'||c.k==='pos')?1:-1}paint()});
      th.addEventListener('keydown',e=>{if(e.key==='Enter')th.click()});hr.append(th)});
    tb.replaceChildren();
    const sorted=[...rows].sort((a,b)=>{const x=a[sortK],y=b[sortK];if(typeof x==='string')return dir*x.localeCompare(y);const nv=q=>q==null?(dir<0?-Infinity:Infinity):q;return nv(x)===nv(y)?0:dir*(nv(x)-nv(y))});
    for(const r of sorted){
      const tr=el('tr');
      cols.forEach(c=>{const td=el('td',c.r?'r':'');c.cell(td,r);tr.append(td)});
      tb.append(tr);
    }
  }
  paint();card.append(tw);return card;
}
function barCell(td,v,max,color,txt){

  w.append(b,t);td.append(w);
}
function viewAgent(v){

    {k:'aht',l:'AHT',r:1,cell:ahtCell(TH.ahtTS)},{k:'talk',l:'Đàm thoại',r:1,cell:(td,r)=>td.textContent=fS(r.talk)},{k:'hold',l:'Giữ máy',r:1,cell:(td,r)=>td.textContent=fS(r.hold)},
    {k:'acw',l:'ACW',r:1,cell:(td,r)=>td.textContent=fS(r.acw)},{k:'perShift',l:'Cuộc/ca',r:1,cell:(td,r)=>td.textContent=fN(r.perShift)},{k:'whyN',l:'Ghi chú',cell:noteCell}];
  s1.append(agentTable(0,ts,colsT,'calls','conv'));v.append(s1);
  /* CS-VT */
  const cs=agentRows(1),maxA=Math.max(...cs.map(r=>r.calls),1);
  const s2=sec('CS-VT · Inbound','Xếp hạng theo số cuộc xử lý mỗi ca. AHT xanh ≤ 360 s. Cuộc bỏ máy chưa tới agent nên không tính cho agent.');
  const colsC=[
    {k:'ext',l:'Agent',cell:nm},{k:'pos',l:'Hạng',r:1,cell:(td,r)=>td.textContent=r.pos||'–'},{k:'shifts',l:'Ca',r:1,cell:(td,r)=>td.textContent=r.shifts},
    {k:'calls',l:'Cuộc xử lý',r:1,cell:(td,r)=>barCell(td,r.calls,maxA,'var(--s2)',fN(r.calls))},{k:'perShift',l:'Cuộc/ca',r:1,cell:(td,r)=>td.textContent=fN(r.perShift)},
    {k:'resolvedR',l:'Giải quyết xong',r:1,cell:(td,r)=>td.textContent=fP(r.resolvedR)},{k:'escR',l:'Khiếu nại cấp 2',r:1,cell:(td,r)=>td.textContent=fP(r.escR)},{k:'dropR',l:'Rớt cuộc gọi',r:1,cell:(td,r)=>td.textContent=fP(r.dropR)},
    {k:'aht',l:'AHT',r:1,cell:ahtCell(TH.ahtCS)},{k:'talk',l:'Đàm thoại',r:1,cell:(td,r)=>td.textContent=fS(r.talk)},{k:'hold',l:'Giữ máy',r:1,cell:(td,r)=>td.textContent=fS(r.hold)},

  const nn=el('p','note',`${fN(none)} dòng không có mã agent: ${fN(noneAb)} cuộc bỏ máy (hợp lệ theo QT-09) và ${fN(none-noneAb)} cuộc đã nghe bị gắn cờ QT-09. Các dòng này tính vào sản lượng dự án, không tính vào agent nào.`);

}

  const s1=sec('Tổng kiểm tra','Dòng gốc trong file xuất = dòng sạch + dòng bị loại; cuộc gốc = dòng sạch − chặng chuyển tiếp. Toàn bộ file, không theo bộ lọc ngày.');

  const box=(k,val,ok)=>{const b=el('div','rc');b.append(el('div','k',k),el('div','v',fN(val)));if(ok!=null)b.append(pill(ok?'good':'crit',ok?'Khớp với file sạch':'Không khớp'));return b};

  v.append(s1);

  const s2=sec('Dòng bị tác động theo quy tắc','Một dòng có thể dính nhiều quy tắc nên tổng lớn hơn số dòng. Theo khoảng ngày đang chọn. Chỉ QT-01 loại dòng, các quy tắc khác chỉ gắn cờ hoặc sửa.');

  const items=Object.keys(QT_INFO).map(t=>({t,n:(cnt[t]||[0,0])[0]+(cnt[t]||[0,0])[1],ts:(cnt[t]||[0,0])[0],cs:(cnt[t]||[0,0])[1]})).sort((a,b)=>b.n-a.n);
  const g=el('div','grid g2');
  const card=el('div','card');const ch=el('div','ch');const ct=el('div');ct.append(el('h3','','Số dòng theo mã quy tắc'),el('div','cs','Rê chuột để xem tách theo dự án.'));ch.append(ct);card.append(ch);
  const hb=hbars(items.map(o=>({k:o.t+' · '+QT_INFO[o.t][0],v:o.n,c:'var(--ink2)',extra:[{c:'var(--s1)',k:'TS-BH',v:fN(o.ts)},{c:'var(--s2)',k:'CS-VT',v:fN(o.cs)}]})),0);
  hb.style.setProperty('--lw','300px');card.append(hb);g.append(card);
  const c2=el('div','card');const ch2=el('div','ch');ch2.append(el('h3','','Cách xử lý từng quy tắc'));c2.append(ch2);

  const tb=el('tbody');t.append(tb);
  const tr0=el('tr');tr0.append(el('td','','QT-01'),el('td','','Loại dòng trùng mã, giữ dòng đầu tiên (giữ bằng chứng ở dong_bi_loai)'),el('td','r',fN(R.loai)));tb.append(tr0);
  items.forEach(o=>{const tr=el('tr');tr.append(el('td','',o.t),el('td','',QT_INFO[o.t][1]),el('td','r',fN(o.n)));tb.append(tr)});

/* ===================== ĐIỀU KHIỂN ===================== */
function renderTabs(){
  const t=$('#tabs');t.replaceChildren();
  for(const [id,name] of TABS){
    const b=el('button','',name);b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',st.tab===id);
    b.addEventListener('click',()=>{st.tab=id;try{history.replaceState(null,'','#'+id)}catch(e){}renderTabs();render()});t.append(b);
  }
}
function renderFilters(){
  document.querySelectorAll('.seg [data-p]').forEach(b=>{
    const p=b.dataset.p,r=p==='all'?[0,NDAY-1]:p==='w1'?[0,7]:[8,NDAY-1];
    b.setAttribute('aria-pressed',st.from===r[0]&&st.to===r[1]);
  });
  $('#f-from').value=st.from;$('#f-to').value=st.to;$('#f-sl').value=st.sl;
  $('#f-sum').textContent='Đang xem ngày ca '+rangeText()+' · '+(st.to-st.from+1)+' ngày';
}
function initFilters(){
  const f=$('#f-from'),t=$('#f-to');
  for(let i=0;i<NDAY;i++){f.append(new Option(dlw(i),i));t.append(new Option(dlw(i),i))}
  f.addEventListener('change',()=>{st.from=+f.value;if(st.to<st.from)st.to=st.from;renderFilters();render()});
  t.addEventListener('change',()=>{st.to=+t.value;if(st.from>st.to)st.from=st.to;renderFilters();render()});
  $('#f-sl').addEventListener('change',e=>{st.sl=+e.target.value;render()});
  document.querySelectorAll('.seg [data-p]').forEach(b=>b.addEventListener('click',()=>{
    const p=b.dataset.p;[st.from,st.to]=p==='all'?[0,NDAY-1]:p==='w1'?[0,7]:[8,NDAY-1];renderFilters();render()}));
}
function render(){
  hideTip();resetRO();
  const v=$('#view');v.replaceChildren();
  ({'tong-quan':viewTQ,'cs-vt':viewIN,'ts-bh':viewOUT,'agent':viewAgent,'du-lieu':viewDQ})[st.tab](v);
  renderFilters();
}
$('#meta').textContent=`${M.file} · ${fN(M.rows)} dòng sạch · ${M.t0.slice(0,10).split('-').reverse().slice(0,2).join('/')} đến ${M.t1.slice(0,10).split('-').reverse().join('/')}`;
const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h))st.tab=h;
initFilters();renderTabs();render();
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h)&&h!==st.tab){st.tab=h;renderTabs();render()}});
})();
